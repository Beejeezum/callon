name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: python3 scripts/check_repo_structure.py
      - run: python3 scripts/delivery_audit.py
      - run: python3 scripts/verify_bundle.py
      - run: pnpm audit --audit-level high
      - run: pnpm peers check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:client-bundle

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
      - name: Test database lint adapter
        run: python3 -m unittest scripts/test_check_db_lint.py
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - run: supabase db reset
      - run: python3 scripts/check_db_lint.py
      - run: supabase test db

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [web]
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      SHARE_TOKEN_PEPPER: call-on-ci-share-token-pepper-not-for-production
      LOCATION_ENCRYPTION_KEY_V1: call-on-ci-location-key-not-for-production
      EMAIL_PROVIDER: mock
      AI_DRAFTS_ENABLED: "false"
      WHATSAPP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
      - name: Start and migrate isolated local Supabase
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector
          supabase db reset
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - run: pnpm --filter @call-on/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
