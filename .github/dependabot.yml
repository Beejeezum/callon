version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next"]
      supabase:
        patterns: ["@supabase/*"]
      testing:
        patterns: ["vitest", "@playwright/*", "@testing-library/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
